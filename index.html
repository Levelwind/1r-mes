<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>21 Tarjetas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Escenario Pantalla Completa -->
  <main class="viewport">
    
    <!-- Contenedor de las 21 tarjetas -->
    <div class="deck" id="deck"></div>

    <!-- ÚNICOS ELEMENTOS: Botones laterales para cambiar de tarjeta -->
    <button class="nav-btn prev" id="prevBtn" aria-label="Tarjeta anterior">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
    </button>

    <button class="nav-btn next" id="nextBtn" aria-label="Siguiente tarjeta">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="9 18 15 12 9 6"></polyline>
      </svg>
    </button>

  </main>

  <script src="script.js"></script>
</body>
</html>
